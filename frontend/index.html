<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Customer Support Agent</title>
<style>
:root{
  --bg:#f7f8fa; --card:#fff; --ink:#101828; --muted:#667085; --line:#e4e7ec;
  --accent:#1d6fdb; --ok:#067647; --ok-bg:#ecfdf3; --ok-line:#abefc6;
  --warn:#b54708; --warn-bg:#fffaeb; --warn-line:#fedf89;
  --risk-low:#667085; --risk-med:#b54708; --risk-high:#b42318;
  --radius:10px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1115;--card:#171a21;--ink:#e8eaed;--muted:#9aa4b2;--line:#282d37;
        --ok-bg:#0d2818;--ok-line:#1e5233;--warn-bg:#2a1f08;--warn-line:#5c4318;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:940px;margin:0 auto;padding:32px 20px 72px}
header{margin-bottom:26px}
h1{font-size:26px;font-weight:650;letter-spacing:-.02em;margin:0 0 6px}
.sub{color:var(--muted);font-size:15px;margin:0}
.badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;color:var(--muted);border:1px solid var(--line);
  border-radius:99px;padding:3px 9px;margin-top:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px}
label{display:block;font-weight:600;font-size:13px;margin-bottom:8px}
textarea{width:100%;min-height:96px;resize:vertical;padding:12px 14px;border:1px solid var(--line);
  border-radius:8px;font:inherit;background:var(--bg);color:var(--ink)}
textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
button{font:inherit;font-weight:600;border-radius:8px;padding:10px 18px;cursor:pointer;border:1px solid transparent}
.primary{background:var(--accent);color:#fff}
.primary:hover:not(:disabled){filter:brightness(1.08)}
.primary:disabled{opacity:.55;cursor:not-allowed}
.hint{color:var(--muted);font-size:12.5px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:99px;
  padding:6px 12px;cursor:pointer;color:var(--muted);transition:.15s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.banner{border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;border:1px solid}
.banner.auto{background:var(--ok-bg);border-color:var(--ok-line)}
.banner.esc{background:var(--warn-bg);border-color:var(--warn-line)}
.banner h2{margin:0 0 4px;font-size:18px;display:flex;align-items:center;gap:9px}
.banner.auto h2{color:var(--ok)} .banner.esc h2{color:var(--warn)}
.banner p{margin:0;font-size:14px;color:var(--ink);opacity:.9}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat .k{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:19px;font-weight:600;margin-top:5px;word-break:break-word}
.stat .n{font-size:12px;color:var(--muted);margin-top:3px}
.bar{height:5px;background:var(--line);border-radius:99px;margin-top:9px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s ease}
.sec-title{font-size:13px;font-weight:650;letter-spacing:.03em;text-transform:uppercase;
  color:var(--muted);margin:0 0 12px}
.quote{background:var(--bg);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:13px 15px;font-size:14.5px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.amber{color:var(--warn);border-color:var(--warn-line);background:var(--warn-bg)}
.ev{border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:10px;background:var(--bg)}
.ev-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.sim{font-size:12px;font-weight:650;padding:3px 9px;border-radius:99px;background:var(--line);color:var(--ink)}
.sim.hi{background:var(--ok-bg);color:var(--ok)} .sim.mid{background:var(--warn-bg);color:var(--warn)}
.ev p{margin:6px 0}
.ev .who{font-size:11px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.trust li{margin-bottom:7px;font-size:14px}
.trust code{background:var(--bg);padding:1px 6px;border-radius:4px;font-size:13px}
details{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:14px 18px}
summary{cursor:pointer;font-weight:600;font-size:14px}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
td{padding:5px 8px;border-bottom:1px solid var(--line)}
td:first-child{color:var(--muted)}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.flag{font-size:11.5px;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line);
  border-radius:99px;padding:3px 9px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.step{font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 9px;color:var(--muted)}
.empty,.err{text-align:center;padding:44px 20px;color:var(--muted)}
.err{color:#b42318;background:#fef3f2;border:1px solid #fecdca;border-radius:var(--radius)}
@media (prefers-color-scheme:dark){.err{background:#2d1414;border-color:#5c2020}}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
  border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fi .35s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
footer{margin-top:34px;color:var(--muted);font-size:12.5px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AI Customer Support Agent</h1>
    <p class="sub">Evidence-backed, confidence-aware customer support automation</p>
    <span class="badge" id="brandBadge">loading…</span>
  </header>

  <div class="card">
    <label for="msg">Customer message</label>
    <textarea id="msg" placeholder="Paste a customer tweet…"></textarea>
    <div class="row">
      <button class="primary" id="go">Analyze Message</button>
      <span class="hint" id="hint">Ctrl+Enter to submit</span>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div id="out"><div class="empty">Enter a customer message, or pick a demo case above.</div></div>

  <footer>
    Intent model + TF-IDF retrieval + deterministic policy + LLM drafting ·
    every field below comes from the live API
  </footer>
</div>

<script>
const API = location.origin;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = v => (v*100).toFixed(0) + "%";
const nice = s => String(s ?? "").replace(/_/g, " ");

// ---- boot: brand + demo cases from the backend, never hard-coded -----------
(async () => {
  try {
    const h = await (await fetch(API + "/health")).json();
    $("#brandBadge").textContent =
      `${h.brand} · ${Number(h.historical_cases_indexed).toLocaleString()} historical cases · ${h.llm_backend}`;
  } catch { $("#brandBadge").textContent = "backend unreachable"; }
  try {
    const d = await (await fetch(API + "/demo_cases")).json();
    $("#chips").innerHTML = d.cases.map(c =>
      `<span class="chip" data-m="${esc(c.message)}" title="${esc(c.why_included)}">${esc(c.label)}</span>`).join("");
    document.querySelectorAll(".chip").forEach(el =>
      el.onclick = () => { $("#msg").value = el.dataset.m; $("#msg").focus(); });
  } catch {}
})();

$("#go").onclick = run;
$("#msg").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) run();
});

async function run() {
  const message = $("#msg").value.trim();
  if (!message) { $("#msg").focus(); return; }
  const btn = $("#go");
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>Analyzing…';
  $("#out").innerHTML = `<div class="empty">Classifying intent, retrieving precedents, validating evidence…<br>
    <span class="hint">Reply drafting calls an LLM and can take 10–25s on a rate-limited free tier.</span></div>`;
  try {
    const r = await fetch(API + "/predict", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ message })
    });
    if (!r.ok) throw new Error(`API returned ${r.status}: ${(await r.text()).slice(0,200)}`);
    render(message, await r.json());
  } catch (e) {
    $("#out").innerHTML = `<div class="err"><strong>Request failed</strong><br>${esc(e.message)}
      <br><span class="hint">Is the backend running? <code>uvicorn src.api:app --port 8000</code></span></div>`;
  } finally {
    btn.disabled = false; btn.textContent = "Analyze Message";
  }
}

function render(message, d) {
  const auto = d.decision === "AUTO-HANDLE";
  const riskColor = {LOW:"var(--risk-low)",MEDIUM:"var(--risk-med)",HIGH:"var(--risk-high)"}[d.risk_level] || "var(--muted)";

  const evidence = (d.evidence || []).map(e => {
    const cls = e.similarity >= .4 ? "hi" : e.similarity >= .2 ? "mid" : "";
    return `<div class="ev">
      <div class="ev-head">
        <span class="sim ${cls}">similarity ${pct(e.similarity)}</span>
        <span>
          <span class="tag">${esc(nice(e.historical_intent))}</span>
          ${e.is_boilerplate ? '<span class="tag amber">generic reply — weak evidence</span>' : ''}
        </span>
      </div>
      <p class="who">Customer said</p><p>${esc(e.customer_message)}</p>
      <p class="who">Spotify replied</p><p>${esc(e.historical_reply)}</p>
    </div>`;
  }).join("") || '<p class="hint">No historical precedent was retrieved.</p>';

  const sig = d.evidence_signals || {};
  const sigRows = Object.entries(sig).map(([k,v]) =>
    `<tr><td>${esc(nice(k))}</td><td>${pct(v)}</td></tr>`).join("");

  // "Why the agent trusts this" — assembled only from real returned fields.
  const trust = [];
  trust.push(`Intent <code>${esc(nice(d.intent))}</code> at <code>${pct(d.intent_confidence)}</code> confidence,
    ${d.intent_margin >= .15
      ? `a clear <code>${pct(d.intent_margin)}</code> ahead of the runner-up <code>${esc(nice(d.intent_runner_up))}</code>`
      : `only <code>${pct(d.intent_margin)}</code> ahead of <code>${esc(nice(d.intent_runner_up))}</code> — too close to call confidently`}.`);
  const top = (d.evidence||[])[0];
  if (top) trust.push(`Closest historical case matches at <code>${pct(top.similarity)}</code> similarity${
    top.is_boilerplate ? ', but that precedent is a generic hand-off with no resolution content' : ''}.`);
  trust.push(`Evidence quality <code>${pct(d.evidence_quality)}</code>, combining precedent similarity,
    how many cases support it, whether they agree on intent, and whether they resolve it the same way.`);
  trust.push(`Risk level <code>${esc(d.risk_level)}</code>${
    d.risk_level === "HIGH" ? " — high-risk cases always require human sign-off, whatever the confidence" : ""}.`);
  if ((d.evidence_flags||[]).length)
    trust.push(`Evidence flags raised: ${d.evidence_flags.map(f=>`<code>${esc(f)}</code>`).join(", ")}.`);
  if (d.critique) trust.push(`Draft passed to the response critic: verdict <code>${esc(d.critique.verdict)}</code>,
    lexical grounding <code>${pct(d.critique.grounding_score||0)}</code>${
      (d.critique.issues||[]).length ? `, issues: ${d.critique.issues.map(i=>`<code>${esc(i)}</code>`).join(", ")}` : ""}.`);

  $("#out").innerHTML = `
  <div class="fade">
    <div class="card">
      <p class="sec-title">Customer message</p>
      <div class="quote">${esc(message)}</div>
    </div>

    <div class="banner ${auto ? "auto" : "esc"}">
      <h2>${auto ? "✓ AUTO-HANDLE" : "⚠ ESCALATE TO HUMAN"}</h2>
      <p><strong>${auto ? "Agent can safely handle this request." : "Human review recommended."}</strong></p>
      <p style="margin-top:8px">${esc(d.decision_reason)}</p>
    </div>

    <p class="sec-title">Agent analysis</p>
    <div class="stats">
      <div class="stat"><div class="k">Intent</div><div class="v">${esc(nice(d.intent))}</div>
        <div class="n">runner-up: ${esc(nice(d.intent_runner_up))}</div></div>
      <div class="stat"><div class="k">Intent confidence</div><div class="v">${pct(d.intent_confidence)}</div>
        <div class="bar"><i style="width:${(d.intent_confidence*100).toFixed(1)}%"></i></div>
        <div class="n">${d.calibrated ? "calibrated probability" : "uncalibrated"}</div></div>
      <div class="stat"><div class="k">Risk level</div>
        <div class="v" style="color:${riskColor}">${esc(d.risk_level)}</div>
        <div class="n">policy-assigned, not model-assigned</div></div>
      <div class="stat"><div class="k">Evidence quality</div><div class="v">${pct(d.evidence_quality)}</div>
        <div class="bar"><i style="width:${(d.evidence_quality*100).toFixed(1)}%"></i></div>
        <div class="n">${(d.evidence||[]).length} precedents retrieved</div></div>
    </div>

    <div class="card">
      <p class="sec-title">Suggested response</p>
      ${d.reply_is_suggestion_only
        ? '<p><span class="tag amber">Draft for human review — not sent automatically</span></p>' : ''}
      <div class="quote">${esc(d.reply) || '<span class="hint">No reply drafted.</span>'}</div>
      <p class="hint" style="margin-top:10px">generated by: <code>${esc(d.generation_backend)}</code>
        · ${Number(d.latency_ms).toFixed(0)} ms</p>
    </div>

    <div class="card">
      <p class="sec-title">Why the agent trusts this</p>
      <ul class="trust">${trust.map(t=>`<li>${t}</li>`).join("")}</ul>
    </div>

    <div class="card">
      <p class="sec-title">Historical evidence — what this is based on</p>
      ${evidence}
    </div>

    <details>
      <summary>Agent trace &amp; raw signals</summary>
      <div class="steps">${(d.trace||[]).map((t,i)=>`<span class="step">${i+1}. ${esc(t.tool)}</span>`).join("")}</div>
      <table>${sigRows}</table>
      ${(d.evidence_flags||[]).length
        ? `<div class="flags">${d.evidence_flags.map(f=>`<span class="flag">${esc(f)}</span>`).join("")}</div>` : ""}
    </details>
  </div>`;
}
</script>
</body>
</html>
